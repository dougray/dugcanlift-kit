name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch supersedes the run in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: swift test
    # macos-26 ships Xcode 26.6, matching local. The package's tests run on
    # the macOS host; no simulator and no signing involved.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      # The trailing swift-testing line reads "0 tests in 0 suites" because
      # every test here is XCTest; the real count is the "Executed N tests"
      # line above it. Fail on the exit code, not on that summary.
      - name: Unit tests
        run: swift test

  data:
    name: Road Food data
    # Plain node, no Xcode: this job is the one that fails when road-food.json
    # and road-food.sha256 disagree, which is what the five app repos pin their
    # copies to. Ubuntu because nothing here reads a PDF or touches the network.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      # Shape and honesty checks, plus the checksum. A stale checksum fails
      # here rather than months later in an app repo that took the file but
      # not the hash.
      - name: Validate road-food.json
        run: node data/validate-road-food.mjs

      # recipes.json is derived from LiftReference's recipes.db for the builds
      # that cannot open SQLite; a rebuilt database without a re-export fails here.
      - name: recipes.json matches recipes.db
        run: python3 -I Tools/export_recipes_json.py --check

      # The barcode bundle's builder, against its hand-written USDA sample, and
      # the shared barcode fixture's checksum. No download: the real build is
      # run by hand at each USDA release (data/README.md, "Branded foods").
      - name: Branded foods builder tests
        run: python3 -I Tools/tests/test_build_branded_foods.py

      # The recipe bookmarklet: the four javascript: URLs are built from
      # send-recipe.js, and the decoder is checked against a link it wrote.
      - name: Bookmarklets match their source
        run: node bookmarklet/build-bookmarklets.mjs --check
      - name: Bookmarklet tests
        run: node --test bookmarklet/*.test.mjs

      # The files are listed by glob rather than as "data/", because node 24
      # reads a bare directory as a module to load and fails; node 26 walks it.
      # Spelling out the files works on both, and is what data/README.md says.
      - name: Data unit tests
        run: node --test data/*.test.mjs
